name: completion scan probe
on:
  push:
    branches: [tr05]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: tools/fetch-toolchain
      - name: Repeat checked fallback
        shell: bash
        run: |
          set -u
          export YEW_ROOT="$GITHUB_WORKSPACE" YEW_LOG=/dev/null YEW_FL_VM_CHECKS=1 SHELL=/bin/sh
          export HOME="$RUNNER_TEMP/probe-home" XDG_STATE_HOME="$GITHUB_WORKSPACE/target/test-state"
          mkdir -p "$HOME" "$XDG_STATE_HOME" target/tests target/probe
          . tools/lib-toolchain.sh
          failures=0
          for i in $(seq 1 21); do
            echo "START fallback-$i $(date -u +%FT%TZ)"
            if "$WOLF" test --deny-warnings --nocapture src/edit_cmdline_test.lu >"target/probe/$i.log" 2>&1; then rc=0; else rc=$?; failures=$((failures + 1)); fi
            grep -E 'cmdline_bang_completions_use_the_same_pager|wolf-trap:|at src/edit_cmdline_test.lu:|test src/edit_cmdline_test.lu::main|wolf test:' "target/probe/$i.log" || true
            echo "END fallback-$i exit=$rc $(date -u +%FT%TZ)"
          done
          echo "fallback: $failures failed of 21"
          test "$failures" -eq 0
      - name: Preserve probe logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: completion-scan-probe
          path: target/probe/
          if-no-files-found: warn
