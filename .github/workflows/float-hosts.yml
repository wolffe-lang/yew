name: float-hosts
on:
  pull_request:
    paths:
      - 'notes/yw07b-evidence/floats/**'
      - 'src/fl/float.lu'
      - '.github/workflows/float-hosts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oracle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record public C conversion answers
        shell: bash
        run: |
          set -euo pipefail
          export YEW_ROOT="$PWD" YEW_RUNTIME_DIR="$PWD/runtime"
          . tools/lib-test-env.sh
          test_env_begin
          mkdir -p target/floats
          cc -std=c11 -pedantic -Wall -Wextra -Werror -O2 notes/yw07b-evidence/floats/oracle.c -o target/floats/oracle
          python3 -I notes/yw07b-evidence/floats/corpus.py target/floats/corpus.txt
          python3 -I notes/yw07b-evidence/floats/host.py target/floats/corpus.txt target/floats/oracle target/floats/host
      - uses: actions/upload-artifact@v4
        with:
          name: float-oracle-${{ matrix.os }}
          path: target/floats/host/
  compare:
    needs: oracle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: float-oracle-*
          path: target/float-hosts
      - name: Refuse host-divergent C conversions
        run: python3 -I notes/yw07b-evidence/floats/host-compare.py target/float-hosts/float-oracle-ubuntu-24.04 target/float-hosts/float-oracle-macos-14 target/float-hosts/comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: float-host-comparison
          path: target/float-hosts/comparison.json
