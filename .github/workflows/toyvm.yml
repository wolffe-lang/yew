# Local evidence gate: unlabelled PRs are cheap; ci/full-matrix opt in.
# Existing release labels, nightly tiers and every test command are preserved.
name: toyvm
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [trunk]
    paths:
      - '.github/**'
      - 'ci/**'
      - '!ci/**/*.md'
      - 'tools/**'
      - 'spec/**'
      - '**/wolf-toolchain.toml'
      - '**/rust-toolchain.toml'
      - '**/*.pin'
      - '**/PAIRING'
      - '**/STD-PIN'
      - 'vendor/tools.toml'
      - 'gnu-oracle.toml'
      - '.gitmodules'
      - 'Cargo.toml'
      - 'Cargo.lock'
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collector:
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-matrix') || contains(github.event.pull_request.labels.*.name, 'ci') || contains(github.event.pull_request.labels.*.name, 'release-matrix')) }}
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - name: Install build tools
        run: apt-get update -qq && apt-get install -y --no-install-recommends ca-certificates curl git clang gcc libc6-dev python3
      - uses: actions/checkout@v4
      - name: Fetch digest-pinned toolchain
        run: tools/fetch-toolchain
      - name: Root cycle reentry memory and shared controls
        shell: bash
        run: ulimit -c 0; notes/yw07-evidence/toyvm/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toyvm-evidence
          path: target/toyvm/*.log
