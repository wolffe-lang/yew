name: toyvm
on:
  pull_request:
    paths:
      - 'notes/yw07-evidence/toyvm/**'
      - '.github/workflows/toyvm.yml'
  push:
    branches: [trunk]
    paths:
      - 'notes/yw07-evidence/toyvm/**'
      - '.github/workflows/toyvm.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  YEW_BUILD_MEMORY: '1'
  # Report only; an enforcing percentage still needs approval.
  YEW_BUILD_MEMORY_ENFORCE: '0'
  YEW_BUILD_MEMORY_LIMIT_PERCENT: '85'
jobs:
  collector:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - name: Install build tools
        run: apt-get update -qq && apt-get install -y --no-install-recommends ca-certificates curl git clang gcc libc6-dev python3
      - uses: actions/checkout@v4
      - name: Fetch digest-pinned toolchain
        run: tools/fetch-toolchain
      - name: Root cycle reentry memory and shared controls
        shell: bash
        run: ulimit -c 0; notes/yw07-evidence/toyvm/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toyvm-evidence
          path: target/toyvm/*.log
      - name: compiler memory report
        if: ${{ always() }}
        run: python3 -I ci/build-memory.py report
      - name: compiler memory baseline artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-memory-collector-single
          path: ${{ runner.temp }}/yew-build-memory/
          retention-days: 30
          if-no-files-found: warn
