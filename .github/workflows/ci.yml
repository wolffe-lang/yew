name: yw07 plant
on: [pull_request]
permissions:
  contents: read
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the committed toolchain by digest
        run: tools/fetch-toolchain
      - name: Existing gate must reject the implementation regression
        shell: bash
        run: |
          mkdir -p target/plant-home/{home,config,state,cache,tmp}
          docker run --rm --init --pids-limit 4096 --memory 8g --ulimit core=0 \
            -v /usr:/usr:ro -v "$PWD:$PWD" -w "$PWD" \
            -e HOME="$PWD/target/plant-home/home" \
            -e XDG_CONFIG_HOME="$PWD/target/plant-home/config" \
            -e XDG_STATE_HOME="$PWD/target/plant-home/state" \
            -e XDG_CACHE_HOME="$PWD/target/plant-home/cache" \
            -e TMPDIR="$PWD/target/plant-home/tmp" \
            -e YEW_RUNTIME_DIR="$PWD/runtime" -e CARGO_INCREMENTAL=0 \
            ubuntu:24.04 bash ci/yw07-plant.sh
