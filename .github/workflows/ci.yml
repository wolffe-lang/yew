name: ci
on:
  pull_request:
    paths:
      - 'notes/yw07-evidence/toyvm/**'
      - '.github/workflows/toyvm.yml'
  push:
    branches: [trunk]
    paths:
      - 'notes/yw07-evidence/toyvm/**'
      - '.github/workflows/toyvm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collector:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 15
    steps:
      - name: Install build tools
        run: apt-get update -qq && apt-get install -y --no-install-recommends ca-certificates curl git clang gcc libc6-dev python3
      - uses: actions/checkout@v4
      - name: Fetch digest-pinned toolchain
        run: tools/fetch-toolchain
      - name: Expected red root control
        shell: bash
        run: ulimit -c 0; notes/yw07-evidence/toyvm/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toyvm-evidence
          path: target/toyvm/*.log
