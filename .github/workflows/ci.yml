# yw07b plant `cases`: this branch's ci.yml is cut to the one gate the
# planted break must turn red (RULES §7: the smallest run that shows it).
# The branch is never merged; the orchestrator closes its draft PR.
name: ci
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plant:
    name: plant (cases)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: the 198 pinned Fletch cases, by name and in registry order
        shell: bash
        run: python3 -I tools/check-fl-cases --selftest && python3 -I tools/check-fl-cases

