# yw07b plant `trace`: this branch's ci.yml is cut to the one gate the
# planted break must turn red (RULES §7: the smallest run that shows it).
# The branch is never merged; the orchestrator closes its draft PR.
name: ci
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plant:
    name: plant (trace)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: C yew at the pin, built
        run: tools/oracle --cc gcc --build-only
      - name: the pinned toolchain, by digest
        run: tools/fetch-toolchain
      - name: build the port, release tier
        run: tools/build --release
      - name: the Fletch executed-opcode traces against C's, twice
        shell: bash
        run: tools/check-fl-trace

