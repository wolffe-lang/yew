# yew — the pinned toolchain.
#
# wolf and lupin come from their RELEASE ARCHIVES, pinned by sha256
# digest, never from a source build: the shape boreutils and pelt pin
# with. `tools/fetch-toolchain` downloads the archive for this host,
# refuses on a digest mismatch, and stages the whole archive into
# `.wolf-bin/` (gitignored) — the native tier needs `libwolf_rt.a`
# beside the driver.
#
# Identity is the FIRST line of `--version`: `tools/lib-toolchain.sh`
# refuses when it drifts from `version_line`. `rev` is information: the
# commit the tag names.
#
# One row per host target yew is built on. Windows is out of scope
# (yew is a POSIX program), so its archive is not pinned. linux aarch64
# is pinned although wolf 0.2.32 builds NO tier there (wolf-lang#614):
# CI fetches it and asserts the refusal by name, as pelt does, so the
# day a tier arrives the matrix goes red and is widened.
#
# ## The first pin: 0.2.32 / 0.1.54 (yw00, 2026-10-19)
#
# Digests read twice from the release API (wolf-lang release
# `v0.2.32`, wolf-interp release `v0.1.54`; `gh release view --json
# assets`, two passes, identical) and equal to pelt's seventh pin
# (sh18) for all six archives; the linux x86-64 wolf archive hashed
# after download on kasumi (`notes/yw00-evidence/digests.txt`). The
# std pin is the commit the 0.2.32 archive bundles (`std/STD-REV`),
# wolf-std d37c911, which is also pelt's and boreutils' pin at 0.2.32.
# A release lane moves these.
#
# ## The second pin: 0.2.33 / 0.1.54 (yw01, 2026-10-19)
#
# wolf 0.2.33 (`v0.2.33`, r38's STOP 1) brings the five 0.2.33 calls
# (`os_signal_ignore_one`, `os_signal_default_one`, `os_exit_signal`,
# `os_wait_status_core`, `os_wait_poll_core`, s246) and `os_signal_text(0)`
# now answering the host's words ("Unknown signal 0"); wolf-std `cceda63`
# (sc64 + sc65) names every signal meaning and makes `signal.text(0)` true
# on both tiers. yw01 needs `os_exit_signal` for #93 R1's interim B death
# path and the full signal table for the restore's listen + re-raise. lupin
# stays 0.1.54. Digests read twice from the `v0.2.33` release API,
# identical both passes (notes/yw01-the-terminal.md §1).

[wolf]
version = "0.2.33"
repo = "wolffe-lang/wolf-lang"
rev = "85dab5d7e597680d6fd7034f1d7ed2acb9a92f97"
version_line = "wolf 0.2.33 (wolfgang, pin 85dab5d)"
aarch64-apple-darwin = "9152dbd136d858539100088394cbaa97cf23f7ddd2816512cd9b48c70a9f40eb"
x86_64-unknown-linux-gnu = "4f955e8dfe6eaafa441903eeba43c009c4ec2b45a8da09fe13431e8b12340af8"
aarch64-unknown-linux-gnu = "24cde9e4668d17448527f774db602d93a348d285c2219a1edff791519530a2ac"

[lupin]
# The reference interpreter wolf 0.2.32 declares as its pairing:
# `wolf --version` line 2 reads "paired with lupin 0.1.54 (reference
# interpreter), pin 294d626".
version = "0.1.54"
repo = "wolffe-lang/wolf-interp"
rev = "0e536e8fb4518eaa798ac426901ab81275db5c9f"
version_line = "lupin 0.1.54 (wolf-interp, reference interpreter at pin 294d626)"
aarch64-apple-darwin = "9cd14db71e32c277829b5e05cdae27bf60cd6f269a9a24f97a7dba67e28a4093"
x86_64-unknown-linux-gnu = "175df23880cd5bb993b778e5c8fdd7d0d96c176696802e640f6fc87d3dab40dd"
aarch64-unknown-linux-gnu = "5fb15e31289d810129b40a9a0af07417d85d5090e74045f66b1f7f4016d166e7"

[std]
# The tree is pinned by commit: git's object hash is the digest. This
# is the commit the 0.2.33 archive bundles as `std/` (`std/STD-REV`,
# sc64 + sc65); it names every signal meaning and makes `signal.text(0)`
# answer the host's words on both tiers.
repo = "wolffe-lang/wolf-std"
rev = "cceda63151430eac07df895fdfffddfa4a0b92c1"
