# yew — the pinned toolchain.
#
# wolf and lupin come from their RELEASE ARCHIVES, pinned by sha256
# digest, never from a source build: the shape boreutils and pelt pin
# with. `tools/fetch-toolchain` downloads the archive for this host,
# refuses on a digest mismatch, and stages the whole archive into
# `.wolf-bin/` (gitignored) — the native tier needs `libwolf_rt.a`
# beside the driver.
#
# Identity is the FIRST line of `--version`: `tools/lib-toolchain.sh`
# refuses when it drifts from `version_line`. `rev` is information: the
# commit the tag names.
#
# One row per host target yew is built on. Windows is out of scope
# (yew is a POSIX program), so its archive is not pinned. linux aarch64
# is pinned although wolf 0.2.32 builds NO tier there (wolf-lang#614):
# CI fetches it and asserts the refusal by name, as pelt does, so the
# day a tier arrives the matrix goes red and is widened.
#
# ## The first pin: 0.2.32 / 0.1.54 (yw00, 2026-10-19)
#
# Digests read twice from the release API (wolf-lang release
# `v0.2.32`, wolf-interp release `v0.1.54`; `gh release view --json
# assets`, two passes, identical) and equal to pelt's seventh pin
# (sh18) for all six archives; the linux x86-64 wolf archive hashed
# after download on kasumi (`notes/yw00-evidence/digests.txt`). The
# std pin is the commit the 0.2.32 archive bundles (`std/STD-REV`),
# wolf-std d37c911, which is also pelt's and boreutils' pin at 0.2.32.
# A release lane moves these.
#
# ## The second pin: 0.2.33 / 0.1.54 (yw01, 2026-10-19)
#
# wolf 0.2.33 (`v0.2.33`, r38's STOP 1) brings the five 0.2.33 calls
# (`os_signal_ignore_one`, `os_signal_default_one`, `os_exit_signal`,
# `os_wait_status_core`, `os_wait_poll_core`, s246) and `os_signal_text(0)`
# now answering the host's words ("Unknown signal 0"); wolf-std `cceda63`
# (sc64 + sc65) names every signal meaning and makes `signal.text(0)` true
# on both tiers. yw01 needs `os_exit_signal` for #93 R1's interim B death
# path and the full signal table for the restore's listen + re-raise. lupin
# stays 0.1.54. Digests read twice from the `v0.2.33` release API,
# identical both passes (notes/yw01-the-terminal.md §1).
#
# ## The third pin: 0.2.34 / 0.1.55 (yw05, 2026-10-22)
#
# wolf 0.2.34 (`v0.2.34` at 9da7bdcf, r39) brings s247's `os_fork` and
# s248's calls the editor asked for (ruling #93): `os_term_restore_at_exit`
# (G1, #794), `os_signal_wait_fds` (G2, #795), `fs_sync`/`fs_sync_dir` (G3,
# #796), `fs_realpath` (G4, #797), `os_clock_ns` (G8, #798), the mode int's
# bits 5-7 (G34, #802) and `wolf test` running a test file's own `test_*`
# (G10, #799). Its pairing is lupin 0.1.55 (`v0.1.55` at e642f26). The std
# pin is the commit the 0.2.34 archive bundles (`std/STD-REV`), wolf-std
# e036bec (sc66-sc68); sc69's wrappers (wolf-std 3bacc5f) are the next pin,
# so the port names the prelude calls directly (yew#24). Digests read twice
# from the release API, identical both passes; the linux x86-64 pair hashed
# after download on kasumi, twice (notes/yw05-panes-tabs-groups.md).

# ## yw06 retention decision (2026-10-23T06:00:38Z)
# The prerequisite yw05-tail is merged at 83020234. `gh release list`
# still names v0.2.34 as the latest wolf release; lupin 0.1.56 exists but
# is not this compiler's pairing. Retain all three pins and six platform
# archive digests, re-read twice from the release API without differences.
# Prediction: notes/yw06-evidence/prediction.txt (ce28597).
# The 0.2.35 retirements remain owed by the next bump: yew#17, #20, #22,
# #23, #24, #27 and #40's List.reset/reserve refill, not claimed here.
# C consumers: src/ws/workspace.c:1-247 and src/ws/state_save.c:1-325
# at sagitta 9ace98c2; fs_realpath and the syncs already exist at this pin.

# ## The fourth pin: 0.2.35 / 0.1.56 (yw07, 2026-10-24)
# Latest release lists read at 2026-10-24T08:05:16Z. Six archive digests
# read twice independently (08:06:50Z and 08:06:51Z), identical; Linux
# x86-64 downloads hashed twice on kasumi at 08:07:56Z. Evidence and the
# pre-change prediction are in notes/yw07-evidence/. The bundled STD-REV
# is 2386522e. Retirements follow in separate commits, not claimed here.
# Lupin trunk's is81 fixes are unreleased; this pin retains released 0.1.56.

# ## The fifth pin: 0.2.36 / 0.1.58 (r41q, 2026-11-01)
# wolf 0.2.36 (`v0.2.36`, tag object 86d61559 -> 5adf3d91, r41) and its
# pairing lupin 0.1.58 (`v0.1.58` at 6240efe5, spec pin a5378e3). Six
# archive digests read twice from the release API (00:11:56Z and
# 00:11:57Z), identical and equal to r41's published record; all six
# hashed twice after download (linux x86-64 on hasu, four on nomad).
# The bundled STD-REV is 78b9d3cb (sc72). The pin alone: no source moves.
# Available here and not adopted (yew's own lanes): s265's start-up fix
# (wolf-lang#918; yew#55's rows re-measured by R12), s261's `env_arg0` and
# `env_args_bytes`. wolf-lang#948's E1010 (yew#98) is after this tag.

